name: Release

# Publishes a release when a version tag (like v1.2.3) is pushed:
#   1. runs the full CI suite on the tagged commit,
#   2. creates a GitHub Release with notes from CHANGELOG.md and a ready-to-run bundle,
#   3. publishes a multi-platform Docker image to GitHub Container Registry.
#
# It can also be started by hand from the Actions tab for an existing tag, or
# for a new tag on the selected branch (the tag is created for you).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a version tag like v1.2.3"
            exit 1
          fi
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "::error::Tag $tag does not match package.json version $package_version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            sha="$(git rev-list -n 1 "$tag")"
          else
            echo "Tag $tag does not exist yet; creating it at $GITHUB_SHA"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Tendwell $tag" "$GITHUB_SHA"
            git push origin "$tag"
            sha="$GITHUB_SHA"
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag ($sha), build ${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: prepare
    uses: ./.github/workflows/ci.yml

  github-release:
    name: GitHub Release
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # better-sqlite3 ships prebuilt binaries, so no install scripts are needed.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Generate SvelteKit types
        run: npx svelte-kit sync

      - name: Build
        run: npm run build
        env:
          TENDWELL_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          GIT_COMMIT: ${{ needs.prepare.outputs.sha }}

      - name: Package
        run: |
          name="tendwell-$TAG"
          mkdir -p "dist/$name/scripts" "dist/$name/content"
          cp -r build package.json package-lock.json .npmrc README.md CHANGELOG.md LICENSE "dist/$name/"
          cp scripts/reset-password.js "dist/$name/scripts/"
          cp content/LICENSE "dist/$name/content/LICENSE"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && zip -qr "$name.zip" "$name")
          (cd dist && sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/tendwell-${{ needs.prepare.outputs.tag }}.tar.gz
            dist/tendwell-${{ needs.prepare.outputs.tag }}.zip

      - name: Write release notes
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ---

          **Run it**

          \`\`\`bash
          docker run -p 3000:3000 -v tendwell-data:/data -e ORIGIN=http://localhost:3000 ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION
          \`\`\`

          Or download \`tendwell-$TAG.tar.gz\`, then run \`npm ci --omit=dev && node build\` inside it (Node.js 22.17 or newer).

          Build #${{ github.run_number }} · commit ${{ needs.prepare.outputs.sha }}
          NOTES
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [ "${{ needs.prepare.outputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt \
              --title "Tendwell $TAG" --notes-file notes.md --verify-tag "${flags[@]}"
          fi

  docker:
    name: Docker image
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Image name
        id: image
        # Registry names must be lowercase, and the repository is "Tendwell".
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=build-${{ github.run_number }}
          flavor: |
            latest=${{ needs.prepare.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Tendwell
            org.opencontainers.image.description=A gentle guide after a death
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TENDWELL_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_NUMBER=${{ github.run_number }}
            GIT_COMMIT=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
